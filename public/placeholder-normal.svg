<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Face -->
  <ellipse cx="100" cy="100" rx="80" ry="90" fill="#F0D8B5" />

  <!-- Hair (messy and unkempt) -->
  <path d="M60 40 Q70 20 90 30 Q110 40 120 20 Q130 40 140 30 Q160 20 170 40 L170 60 Q150 80 130 70 Q110 60 100 80 Q90 60 70 70 Q50 80 30 60 Z" fill="#4C2F27" />

  <!-- Eyes -->
  <ellipse cx="80" cy="80" rx="10" ry="15" fill="#FFFFFF" />
  <ellipse cx="120" cy="80" rx="10" ry="15" fill="#FFFFFF" />
  <circle cx="80" cy="85" r="5" fill="#000000" />
  <circle cx="120" cy="85" r="5" fill="#000000" />

  <!-- Eyebrows (slightly raised for a clueless look) -->
  <path d="M70 65 Q80 60 90 65" stroke="#4C2F27" stroke-width="3" fill="transparent" />
  <path d="M110 65 Q120 60 130 65" stroke="#4C2F27" stroke-width="3" fill="transparent" />

  <!-- Nose -->
  <path d="M95 100 Q100 90 105 100" stroke="#D4A574" stroke-width="3" fill="transparent" />

  <!-- Mouth (slightly open, like he's confused) -->
  <path d="M85 120 Q100 130 115 120" stroke="#000000" stroke-width="3" fill="transparent" />
  <path d="M85 120 Q100 125 115 120" stroke="#000000" stroke-width="3" fill="transparent" />

  <!-- Stubble (patchy beard) -->
  <circle cx="90" cy="110" r="2" fill="#4C2F27" />
  <circle cx="100" cy="115" r="2" fill="#4C2F27" />
  <circle cx="110" cy="110" r="2" fill="#4C2F27" />

  <!-- Shirt (simple and worn-out) -->
  <rect x="50" y="160" width="100" height="40" fill="#808080" />
  <path d="M50 160 Q100 140 150 160" stroke="#808080" stroke-width="10" fill="transparent" />

  <!-- Neck -->
  <rect x="85" y="150" width="30" height="20" fill="#F0D8B5" />

  <!-- Ear -->
  <ellipse cx="60" cy="100" rx="8" ry="15" fill="#F0D8B5" />
  <ellipse cx="140" cy="100" rx="8" ry="15" fill="#F0D8B5" />
</svg>